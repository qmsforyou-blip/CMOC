name: SUPERAGENT MVP tests

on:
  push:
    paths:
      - "05 SUPERAGENT/**"
      - "00 Стандарты CMOC/MVP-SUPERAGENT-001*"
      - "00 Стандарты CMOC/STD-008*"
      - "00 Стандарты CMOC/SPEC-002*"
      - "00 Стандарты CMOC/PROMPT-001*"
      - "00 Стандарты CMOC/ORCH-POLICY-001*"
      - "00 Стандарты CMOC/ESCALATION-CONTRACT-001*"
      - ".github/workflows/superagent-mvp.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Generate Inventory and OBJECT INDEX
        run: python "05 SUPERAGENT/rebuild_inventory_object_index.py"

      - name: Check OBJECT INDEX reproducibility
        run: python "05 SUPERAGENT/build_cmoc_object_index.py" --check

      - name: Run MVP runner tests
        working-directory: 05 SUPERAGENT
        run: python -m unittest discover -s . -p "test_*.py" -v

      - name: Run Inventory and Lookup acceptance tests
        working-directory: 05 SUPERAGENT
        run: |
          python test_inventory_builder_001.py
          python test_inventory_object_index_compatibility_001.py
          python test_architecture_lookup.py

      - name: Upload generated Inventory and OBJECT INDEX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmoc-inventory-object-index-control-run
          path: |
            05 SUPERAGENT/cmoc_inventory.json
            05 SUPERAGENT/cmoc_object_index.json
